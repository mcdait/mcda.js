<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCDA.js IIFE Example</title>
  </head>
  <body>
    <h1>MCDA.js IIFE Example (TOPSIS)</h1>

    <p>Every matrix modification immediately recomputes the TOPSIS ranking.</p>

    <table id="matrix">
      <thead>
        <tr>
          <th></th>
          <th>C1 (max)</th>
          <th>C2 (min)</th>
          <th>C3 (max)</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th>A1</th>
          <td><input type="number" value="1" oninput="computeAndDraw()" /></td>
          <td><input type="number" value="2" oninput="computeAndDraw()" /></td>
          <td><input type="number" value="3" oninput="computeAndDraw()" /></td>
        </tr>

        <tr>
          <th>A2</th>
          <td><input type="number" value="4" oninput="computeAndDraw()" /></td>
          <td><input type="number" value="5" oninput="computeAndDraw()" /></td>
          <td><input type="number" value="6" oninput="computeAndDraw()" /></td>
        </tr>

        <tr>
          <th>A3</th>
          <td><input type="number" value="7" oninput="computeAndDraw()" /></td>
          <td><input type="number" value="8" oninput="computeAndDraw()" /></td>
          <td><input type="number" value="9" oninput="computeAndDraw()" /></td>
        </tr>
      </tbody>
    </table>

    <h2>TOPSIS Ranking</h2>

    <ol id="ranking"></ol>

    <script src="https://cdn.jsdelivr.net/npm/mcdajs/dist/index.iife.js"></script>

    <script>
      function matrixFromInputs() {
        return [...document.querySelectorAll("#matrix tbody tr")].map((row) =>
          [...row.querySelectorAll("input")].map((input) => Number(input.value)),
        );
      }

      function draw(result) {
        const list = document.getElementById("ranking");

        list.innerHTML = "";

        result.forEach((item) => {
          const li = document.createElement("li");

          li.textContent = `${item.alternative}: ${item.score.toFixed(6)}`;

          list.appendChild(li);
        });
      }

      function compute(matrix, weights, alternativeNames, criteriaNames, types) {
        const problem = new Mcda.TopsisDecisionProblem();
        problem.matrix = matrix; // [[1,2,3], [4,5,6], [7,8,9]]
        problem.weights = weights; // [0.333, 0.333, 0.333]
        problem.types = types;

        problem.alternatives = alternativeNames;
        problem.criteria = criteriaNames;

        problem.normalizationCallback = Mcda.vectorNormalizationCallback;

        const scores = problem.scores;
        const ranks = Mcda.rank(scores);

        const result = problem.alternatives.map((alternative, i) => ({
          alternative,
          score: scores[i],
          rank: ranks[i],
        }));

        result.sort((a, b) => a.rank - b.rank);
        return result;
      }

      function computeAndDraw() {
        let matrix = matrixFromInputs();
        let weights = [1 / 3, 1 / 3, 1 / 3];
        let alternativeNames = ["A1", "A2", "A3"];
        let criteriaNames = ["C1", "C2", "C3"];
        let types = [
          Mcda.CriterionType.BENEFIT,
          Mcda.CriterionType.COST,
          Mcda.CriterionType.BENEFIT,
        ];

        const result = compute(matrix, weights, alternativeNames, criteriaNames, types);
        draw(result);
      }

      computeAndDraw();
    </script>
  </body>
</html>
